services:

  db:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_DB: consolidator
      POSTGRES_USER: consolidator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consolidator"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:stable}
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - clamdata:/var/lib/clamav

  web:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # .env опционален: без него поднимается на безопасных дефолтах (локальный
    # режим). Для прода заполнить SECRET_KEY + ANTHROPIC_API_KEY в .env.
    env_file:
      - path: .env
        required: false
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: consolidator
      DB_USER: consolidator
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CHANNELS_REDIS_URL: redis://redis:6379/1
      DEFAULT_CACHE_URL: redis://redis:6379/2
      PRICELIST_CACHE_URL: redis://redis:6379/4
      CLAMD_HOST: ${CLAMD_HOST:-clamav}
      CLAMD_PORT: ${CLAMD_PORT:-3310}
      CLAMD_TIMEOUT_SECONDS: ${CLAMD_TIMEOUT_SECONDS:-30}
      # безопасные дефолты для локального запуска без .env:
      SECRET_KEY: ${SECRET_KEY:-}
      QR_SECRET: ${QR_SECRET:-}
      DEBUG_MODE: ${DEBUG_MODE:-True}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz/', timeout=5).read()"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s
    volumes:
      - media:/app/media
      - static:/app/staticfiles

  worker:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command: celery -A consolidator_site worker -l info --concurrency=2
    env_file:
      - path: .env
        required: false
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: consolidator
      DB_USER: consolidator
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEFAULT_CACHE_URL: redis://redis:6379/2
      PRICELIST_CACHE_URL: redis://redis:6379/4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A consolidator_site inspect ping -d celery@$$HOSTNAME --timeout 5 2>/dev/null | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - media:/app/media

  beat:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command: celery -A consolidator_site beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - path: .env
        required: false
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: consolidator
      DB_USER: consolidator
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEFAULT_CACHE_URL: redis://redis:6379/2
      PRICELIST_CACHE_URL: redis://redis:6379/4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  clamdata:
  media:
  static:
