services:

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: consolidator
      POSTGRES_USER: consolidator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consolidator"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

  web:
    build: .
    # .env опционален: без него поднимается на безопасных дефолтах (локальный
    # режим). Для прода заполнить SECRET_KEY + ANTHROPIC_API_KEY в .env.
    env_file:
      - path: .env
        required: false
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: consolidator
      DB_USER: consolidator
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CHANNELS_REDIS_URL: redis://redis:6379/1
      DEFAULT_CACHE_URL: redis://redis:6379/2
      PRICELIST_CACHE_URL: redis://redis:6379/4
      # безопасные дефолты для локального запуска без .env:
      SECRET_KEY: ${SECRET_KEY:-}
      QR_SECRET: ${QR_SECRET:-}
      DEBUG_MODE: ${DEBUG_MODE:-True}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - media:/app/media
      - static:/app/staticfiles

  worker:
    build: .
    command: celery -A consolidator_site worker -l info --concurrency=2
    env_file:
      - path: .env
        required: false
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: consolidator
      DB_USER: consolidator
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEFAULT_CACHE_URL: redis://redis:6379/2
      PRICELIST_CACHE_URL: redis://redis:6379/4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - media:/app/media

  beat:
    build: .
    command: celery -A consolidator_site beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - path: .env
        required: false
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: consolidator
      DB_USER: consolidator
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEFAULT_CACHE_URL: redis://redis:6379/2
      PRICELIST_CACHE_URL: redis://redis:6379/4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  media:
  static:
