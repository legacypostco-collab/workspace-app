{% load static i18n %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Consolidator Parts</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'brand/logo-icon-white.svg' %}"/>
  <style nonce="{{ request.csp_nonce }}">
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;background:#1A1A1A;color:#ECECEC;font-family:'Inter',sans-serif;}
    .err-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;}
    .err-code{font-family:'Golos Text',sans-serif;font-weight:800;font-size:140px;color:#E84A21;line-height:1;letter-spacing:0;}
    .err-title{font-family:'Golos Text',sans-serif;font-weight:700;font-size:28px;color:#ECECEC;margin-top:8px;margin-bottom:12px;}
    .err-text{color:#919191;font-size:14px;max-width:440px;line-height:1.6;margin-bottom:32px;}
    .err-actions{display:flex;gap:10px;}
    .err-btn{padding:11px 22px;border-radius:10px;font-size:13px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
    .err-btn-primary{background:#E84A21;color:#1A1A1A;}
    .err-btn-primary:hover{background:#FF6B3D;}
    .err-btn-ghost{background:transparent;color:#919191;border:1px solid rgba(255,255,255,0.1);}
    .err-btn-ghost:hover{color:#ECECEC;border-color:rgba(232,74,33,0.35);}
    .err-logo{position:absolute;top:24px;left:32px;display:flex;align-items:center;gap:10px;font-family:'Golos Text',sans-serif;font-weight:800;font-size:16px;color:#ECECEC;text-decoration:none;}
    .err-logo img{width:26px;height:26px;display:block;}
    @media(max-width:640px){.err-logo{top:16px;left:16px;font-size:14px;}.err-code{font-size:84px;}.err-title{font-size:24px;}.err-page{padding:88px 20px 32px;}.err-actions{flex-direction:column;width:100%;max-width:280px;}.err-btn{justify-content:center;}}
  </style>
  <link rel="stylesheet" href="{% static 'css/fonts.css' %}?v=20260715_01">
  <link rel="stylesheet" href="{% static 'css/typography.css' %}?v=20260715_01">
</head>
<body>
  <a href="/" class="err-logo">
    <img src="{% static 'brand/logo-icon-white.svg' %}" alt="" width="26" height="26">
    Consolidator Parts
  </a>
  <div class="err-page">
    <div class="err-code">404</div>
    <h1 class="err-title">{% trans "Страница не найдена" %}</h1>
    <p class="err-text">
      {% trans "Запрашиваемая страница не существует, была удалена или перемещена. Проверьте адрес или вернитесь на главную." %}
    </p>
    <div class="err-actions">
      <a href="/" class="err-btn err-btn-primary">← {% trans "На главную" %}</a>
      <a href="/chat/?new=1&amp;run=search_parts" class="err-btn err-btn-ghost">{% trans "Каталог" %}</a>
    </div>
  </div>
</body>
</html>
