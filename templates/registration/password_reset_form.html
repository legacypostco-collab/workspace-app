{% extends "marketplace/base.html" %}
{% load i18n %}
{% block content %}
<div style="max-width:420px;margin:60px auto;padding:24px;background:#fff;border-radius:12px;border:1px solid rgba(0,0,0,0.08);">
  <h2>{% trans "Восстановление пароля" %}</h2>
  <p>{% trans "Введите email — пришлём ссылку для смены пароля." %}</p>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="background:#1a1a1a;color:#fff;padding:10px 16px;border-radius:8px;border:none;cursor:pointer;">
      {% trans "Отправить ссылку" %}
    </button>
  </form>
  <p style="margin-top:14px;font-size:13px;color:rgba(0,0,0,0.6);">
    <a href="{% url 'login' %}">← {% trans "Назад ко входу" %}</a>
  </p>
</div>
{% endblock %}
