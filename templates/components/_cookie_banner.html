{% load i18n %}
<style nonce="{{ request.csp_nonce }}">
  .cookie-consent{position:fixed;bottom:20px;left:20px;right:20px;max-width:560px;margin:0 auto;background:#242424;border:1px solid rgba(232,74,33,.25);border-radius:14px;padding:18px 22px;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:9999;font-family:'Inter',sans-serif;color:#ececec;}
  .cookie-consent__body{display:flex;align-items:flex-start;gap:14px;}
  .cookie-consent__content{flex:1;}
  .cookie-consent__title{font-weight:700;font-size:14px;margin-bottom:6px;}
  .cookie-consent__text{font-size:12px;color:#919191;line-height:1.5;}
  .cookie-consent__text a{color:#e84a21;text-decoration:none;}
  .cookie-consent__actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;}
  .cookie-consent__button{min-height:40px;padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500;font-family:inherit;}
  .cookie-consent__button--necessary{background:transparent;border:1px solid rgba(255,255,255,.1);color:#b8b8b8;}
  .cookie-consent__button--accept{background:#e84a21;border:0;color:#fff;padding-inline:16px;font-weight:600;}
</style>
<div id="cookie-banner" class="cookie-consent" hidden>
  <div class="cookie-consent__body">
    <div class="cookie-consent__content">
      <div class="cookie-consent__title">{% trans "Мы используем файлы cookie" %}</div>
      <div class="cookie-consent__text">
        {% trans "Для авторизации и корректной работы сервиса. Подробнее в" %} <a href="/cookies/">{% trans "правилах использования файлов cookie" %}</a>.
      </div>
    </div>
  </div>
  <div class="cookie-consent__actions">
    <button class="cookie-consent__button cookie-consent__button--necessary" data-ui-click="cookieDecline">{% trans "Только необходимые" %}</button>
    <button class="cookie-consent__button cookie-consent__button--accept" data-ui-click="cookieAccept">{% trans "Принять все" %}</button>
  </div>
</div>
<script nonce="{{ request.csp_nonce }}">
(function(){
  if (!localStorage.getItem('cookie_consent')) {
    document.getElementById('cookie-banner').hidden = false;
  }
})();
function cookieAccept() {
  localStorage.setItem('cookie_consent', 'all');
  document.getElementById('cookie-banner').hidden = true;
}
function cookieDecline() {
  localStorage.setItem('cookie_consent', 'necessary');
  document.getElementById('cookie-banner').hidden = true;
}
</script>
{% load static %}<script src="{% static 'js/ui-events.js' %}?v=1" defer></script>
