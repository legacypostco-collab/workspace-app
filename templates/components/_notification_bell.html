{# Notification bell — drop into topbars. Polls /api/notifications/ every 30s. #}
{% load i18n %}
<div class="notif-wrap" style="position:relative;display:inline-block;">
  <button class="notif-bell" id="notifBell" onclick="toggleNotifs(event)" aria-label="{% trans 'Уведомления' %}" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#919191;position:relative;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    <span class="notif-badge" id="notifBadge" style="display:none;position:absolute;top:-3px;right:-3px;background:#E85C0D;color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 5px;min-width:16px;text-align:center;line-height:1.4;">0</span>
  </button>
  <div class="notif-dropdown" id="notifDropdown" style="display:none;position:absolute;top:42px;right:0;width:340px;max-height:480px;background:#242424;border:1px solid rgba(255,255,255,0.08);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,0.5);z-index:1000;overflow:hidden;">
    <div style="padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-between;align-items:center;">
      <span style="font-weight:700;font-size:13px;color:#ECECEC;">{% trans "Уведомления" %}</span>
      <button onclick="markAllRead()" style="background:none;border:none;color:#E84A21;font-size:11px;cursor:pointer;font-family:inherit;">{% trans "Прочитать все" %}</button>
    </div>
    <div id="notifList" style="max-height:380px;overflow-y:auto;">
      <div style="padding:30px;text-align:center;color:#5E5E5E;font-size:12px;">{% trans "Загрузка..." %}</div>
    </div>
    <div style="padding:10px 16px;border-top:1px solid rgba(255,255,255,0.06);text-align:center;">
      <a href="/chat/#notifications" style="color:#E84A21;font-size:12px;text-decoration:none;">{% trans "Все уведомления" %} →</a>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict';

  function safeNotificationUrl(value) {
    if (!value || typeof value !== 'string') return '';
    try {
      var url = new URL(value, window.location.origin);
      if (url.origin !== window.location.origin) return '';
      if (url.protocol !== 'http:' && url.protocol !== 'https:') return '';
      return url.pathname + url.search + url.hash;
    } catch (e) {
      return '';
    }
  }

  function makeNotification(n) {
    var icons = {info:'ℹ️',order:'📦',rfq:'📋',payment:'💰',sla:'⏱',claim:'⚠️',system:'🔔'};
    var item = document.createElement('div');
    item.style.cssText = 'padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;display:flex;gap:10px;';
    if (!n.is_read) item.style.background = 'rgba(232,74,33,0.05)';

    var icon = document.createElement('div');
    icon.style.cssText = 'font-size:16px;flex-shrink:0;';
    icon.textContent = icons[n.kind] || icons.system;
    icon.setAttribute('aria-hidden', 'true');

    var content = document.createElement('div');
    content.style.cssText = 'flex:1;min-width:0;';

    var title = document.createElement('div');
    title.style.cssText = 'font-size:13px;color:#ECECEC;line-height:1.3;';
    title.style.fontWeight = n.is_read ? '500' : '600';
    title.textContent = String(n.title || '');
    content.appendChild(title);

    if (n.body) {
      var body = document.createElement('div');
      body.style.cssText = 'font-size:11px;color:#919191;margin-top:3px;line-height:1.4;';
      body.textContent = String(n.body);
      content.appendChild(body);
    }

    var created = document.createElement('div');
    created.style.cssText = 'font-size:10px;color:#5E5E5E;margin-top:4px;';
    created.textContent = String(n.created_at || '');
    content.appendChild(created);

    item.appendChild(icon);
    item.appendChild(content);
    item.addEventListener('click', function() {
      var destination = safeNotificationUrl(n.url);
      var request = window.markRead(n.id);
      if (destination) {
        Promise.resolve(request).finally(function() {
          window.location.assign(destination);
        });
      }
    });
    return item;
  }

  function showEmptyNotifications(list) {
    var empty = document.createElement('div');
    empty.style.cssText = 'padding:40px;text-align:center;color:#5E5E5E;font-size:12px;';
    empty.textContent = '{% trans "Нет уведомлений" %}';
    list.replaceChildren(empty);
  }

  window.refreshNotifs = function() {
    fetch('/api/notifications/').then(r => r.json()).then(d => {
      var badge = document.getElementById('notifBadge');
      if (d.unread > 0) { badge.style.display = 'inline-block'; badge.textContent = d.unread > 99 ? '99+' : d.unread; }
      else { badge.style.display = 'none'; }
      var list = document.getElementById('notifList');
      if (!d.items.length) {
        showEmptyNotifications(list);
      } else {
        list.replaceChildren.apply(
          list,
          d.items.map(makeNotification)
        );
      }
    }).catch(()=>{});
  };
  window.toggleNotifs = function(e) {
    e.stopPropagation();
    var d = document.getElementById('notifDropdown');
    d.style.display = d.style.display === 'none' ? 'block' : 'none';
    if (d.style.display === 'block') refreshNotifs();
  };
  function getCsrf() { return document.cookie.replace(/(?:(?:^|.*;\s*)csrftoken\s*=\s*([^;]*).*$)|^.*$/, '$1'); }
  window.markRead = function(id) {
    id = Number.parseInt(id, 10);
    if (!Number.isSafeInteger(id) || id <= 0) return Promise.resolve();
    return fetch('/api/notifications/'+id+'/read/', {method:'POST', headers:{'X-CSRFToken':getCsrf()}}).then(refreshNotifs);
  };
  window.markAllRead = function() {
    fetch('/api/notifications/read/', {method:'POST', headers:{'X-CSRFToken':getCsrf()}}).then(refreshNotifs);
  };
  document.addEventListener('click', function(e) {
    var dd = document.getElementById('notifDropdown');
    if (dd && !dd.contains(e.target) && !document.getElementById('notifBell').contains(e.target)) {
      dd.style.display = 'none';
    }
  });
  // ── WebSocket push (with HTTP polling fallback) ──
  var ws = null;
  var wsRetryDelay = 1000;
  function connectWS() {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    try {
      ws = new WebSocket(proto + '//' + location.host + '/ws/notifications/');
    } catch(e) { return startPolling(); }
    ws.onopen = function(){
      wsRetryDelay = 1000;
      // ping every 30s to keep alive
      var pingTimer = setInterval(function(){
        if (ws && ws.readyState === 1) ws.send(JSON.stringify({type:'ping'}));
        else clearInterval(pingTimer);
      }, 30000);
    };
    ws.onmessage = function(ev){
      try {
        var msg = JSON.parse(ev.data);
        if (msg.type === 'notification') {
          refreshNotifs();  // pull fresh list on push
          // Optional: show toast
          if (window.cpToast) cpToast(msg.data.title, msg.data.kind === 'sla' ? 'warn' : 'info');
        } else if (msg.type === 'unread_count') {
          var badge = document.getElementById('notifBadge');
          if (msg.count > 0) { badge.style.display = 'inline-block'; badge.textContent = msg.count > 99 ? '99+' : msg.count; }
          else { badge.style.display = 'none'; }
        }
      } catch(e) {}
    };
    ws.onclose = function(ev){
      ws = null;
      // 4401 = unauthenticated — don't retry
      if (ev.code === 4401) return startPolling();
      // Exponential backoff up to 30s
      wsRetryDelay = Math.min(wsRetryDelay * 2, 30000);
      setTimeout(connectWS, wsRetryDelay);
    };
    ws.onerror = function(){ /* handled by onclose */ };
  }
  function startPolling() {
    refreshNotifs();
    setInterval(refreshNotifs, 30000);
  }
  document.addEventListener('DOMContentLoaded', function(){
    refreshNotifs();  // initial snapshot
    if ('WebSocket' in window) {
      connectWS();
    } else {
      startPolling();
    }
  });
})();
</script>
