# /etc/nginx/sites-available/consolidator.conf
#
# Production nginx для Consolidator Parts.
# Запуск:
#   sudo ln -s /etc/nginx/sites-available/consolidator.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Подразумевает:
#   - Daphne слушает 127.0.0.1:8001 (ASGI с WS-поддержкой)
#   - Certbot уже выпустил сертификат: /etc/letsencrypt/live/consolidatorparts.com/
#   - Проект разложен в /var/www/workspace-app/
#   - Статика собрана в /var/www/workspace-app/staticfiles/
#
# Замени consolidatorparts.com на свой домен.

# ── Brotli (если установлен модуль libnginx-mod-brotli) ──────────
# Без модуля можно закомментировать — gzip ниже даёт основную выгоду.
brotli on;
brotli_comp_level 6;
brotli_types text/plain text/css text/xml application/json application/javascript
             application/xml+rss text/javascript image/svg+xml application/wasm;

# ── HTTP → HTTPS redirect ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name consolidatorparts.com www.consolidatorparts.com;
    # ACME-challenge для certbot renewal
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── Основной HTTPS server ────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name consolidatorparts.com www.consolidatorparts.com;

    # ── TLS ──
    ssl_certificate     /etc/letsencrypt/live/consolidatorparts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/consolidatorparts.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security headers ──
    # HSTS — браузер запоминает HTTPS-only на год
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Остальные CSP/Permissions-Policy/X-Frame-Options идут от SecurityHeadersMiddleware
    # Django — nginx их не перетирает (add_header без override).

    # ── Body / timeouts ──
    client_max_body_size 100M;          # upload прайс-листов / документов
    client_body_timeout 60s;
    keepalive_timeout 75s;
    proxy_read_timeout 120s;           # AI-ответы Claude могут быть медленными
    proxy_send_timeout 60s;
    proxy_connect_timeout 10s;

    # ── Compression ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss text/javascript image/svg+xml application/wasm;

    # ── Static files (WhiteNoise тоже работает, но nginx быстрее) ──
    location /static/ {
        alias /var/www/workspace-app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /var/www/workspace-app/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        # SECURITY: запрещаем выполнение PHP/CGI в media (это user-uploaded)
        location ~ \.(php|pl|py|jsp|asp|aspx|cgi)$ { deny all; }
    }

    # robots / sitemap идут через Django (динамические — Sitemap URL абсолютный)
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── WebSocket (Channels — assistant chat, notifications) ──
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;       # длинные WS-сессии
        proxy_send_timeout 3600s;
    }

    # ── Всё остальное → Daphne ASGI ──
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    # ── Rate-limit для login / register ──
    # Защита от brute-force на /api/assistant/action/ с action=start_login
    # (полная защита — через django-axes, см. settings.py)
    location = /api/assistant/action/ {
        limit_req zone=assistant_actions burst=20 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Длинные операции импорта прайс-листов ──
    # commit / generate-output / ai-estimate обрабатывают весь файл синхронно
    # в запросе. Большой прайс (100K+ строк, напр. полный каталог Epiroc ~160K)
    # на 2-CPU боксе считается дольше дефолтных 120s → nginx рубит запрос 504,
    # фронт получает HTML вместо JSON → «Unexpected token '<'». Поэтому здесь
    # отдельный, щедрый таймаут (до 15 мин), не трогая остальные эндпоинты.
    # `^~` — этот префикс выигрывает у regex-локаций и у `location /`.
    location ^~ /api/assistant/upload-pricelist/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 900s;     # до 15 мин на коммит/генерацию больших прайсов
        proxy_send_timeout 900s;
        client_body_timeout 300s;    # upload крупных файлов (до 100M)
    }

    # ── Логи ──
    access_log /var/log/nginx/consolidator-access.log combined buffer=64k flush=5s;
    error_log  /var/log/nginx/consolidator-error.log warn;
}

# Rate-limit zone — должна быть в http {} блоке nginx.conf, но удобнее
# держать рядом. Если у тебя главный nginx.conf не подцепляет zones из
# sites-available — перенеси эту строку в /etc/nginx/conf.d/zones.conf.
limit_req_zone $binary_remote_addr zone=assistant_actions:10m rate=60r/m;
