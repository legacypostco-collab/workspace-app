<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g3-globe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#EDEDED"/>
    </linearGradient>
  </defs>

  <g transform="translate(50, 10)">
    <!-- Globe -->
    <circle cx="50" cy="50" r="48" fill="url(#g3-globe)" stroke="#1A1A1A" stroke-width="1.8"/>

    <!-- Meridians -->
    <ellipse cx="50" cy="50" rx="20" ry="48" fill="none" stroke="#1A1A1A" stroke-width="1.1" opacity="0.55"/>
    <ellipse cx="50" cy="50" rx="48" ry="18" fill="none" stroke="#1A1A1A" stroke-width="1.1" opacity="0.55"/>
    <line x1="2" y1="50" x2="98" y2="50" stroke="#1A1A1A" stroke-width="1.1" opacity="0.55"/>
    <line x1="50" y1="2" x2="50" y2="98" stroke="#1A1A1A" stroke-width="1.1" opacity="0.55"/>

    <!-- Connection arcs between hubs -->
    <path d="M 28 28 Q 45 18 78 38" fill="none" stroke="#1A1A1A" stroke-width="1.3" stroke-dasharray="2 2.5"/>
    <path d="M 28 28 Q 35 50 55 60" fill="none" stroke="#1A1A1A" stroke-width="1.3" stroke-dasharray="2 2.5"/>
    <path d="M 78 38 Q 75 55 55 60" fill="none" stroke="#1A1A1A" stroke-width="1.3" stroke-dasharray="2 2.5"/>

    <!-- Hub: EU (top-left) -->
    <circle cx="28" cy="28" r="11" fill="none" stroke="#1A1A1A" stroke-width="1" opacity="0.25"/>
    <circle cx="28" cy="28" r="5.5" fill="#1A1A1A"/>
    <circle cx="28" cy="28" r="2" fill="#FFFFFF"/>

    <!-- Hub: China (top-right) -->
    <circle cx="78" cy="38" r="11" fill="none" stroke="#1A1A1A" stroke-width="1" opacity="0.25"/>
    <circle cx="78" cy="38" r="5.5" fill="#1A1A1A"/>
    <circle cx="78" cy="38" r="2" fill="#FFFFFF"/>

    <!-- Hub: UAE (center-bottom) -->
    <circle cx="55" cy="60" r="11" fill="none" stroke="#1A1A1A" stroke-width="1" opacity="0.25"/>
    <circle cx="55" cy="60" r="5.5" fill="#1A1A1A"/>
    <circle cx="55" cy="60" r="2" fill="#FFFFFF"/>
  </g>
</svg>
