<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(35, 15)">
    <!-- Vertical timeline -->
    <line x1="12" y1="8" x2="12" y2="82" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.35"/>

    <!-- Stage 1: completed -->
    <circle cx="12" cy="12" r="9" fill="#1A1A1A"/>
    <path d="M 8 12 L 11 15 L 16 9" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="28" y1="12" x2="95" y2="12" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="100" y1="12" x2="120" y2="12" stroke="#1A1A1A" stroke-width="1.6" opacity="0.25" stroke-linecap="round"/>

    <!-- Stage 2: completed -->
    <circle cx="12" cy="45" r="9" fill="#1A1A1A"/>
    <path d="M 8 45 L 11 48 L 16 42" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="28" y1="45" x2="80" y2="45" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="85" y1="45" x2="110" y2="45" stroke="#1A1A1A" stroke-width="1.6" opacity="0.25" stroke-linecap="round"/>

    <!-- Stage 3: in progress (pulse) -->
    <circle cx="12" cy="78" r="13" fill="none" stroke="#1A1A1A" stroke-width="1" opacity="0.2"/>
    <circle cx="12" cy="78" r="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="12" cy="78" r="3.5" fill="#1A1A1A"/>
    <line x1="28" y1="78" x2="65" y2="78" stroke="#1A1A1A" stroke-width="1.6" opacity="0.5" stroke-linecap="round"/>
    <line x1="70" y1="78" x2="100" y2="78" stroke="#1A1A1A" stroke-width="1.6" opacity="0.18" stroke-linecap="round"/>

    <!-- Speed marks on right -->
    <line x1="130" y1="12" x2="142" y2="12" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" opacity="0.4"/>
    <line x1="120" y1="45" x2="142" y2="45" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
    <line x1="110" y1="78" x2="142" y2="78" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>
  </g>
