<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g4-api" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#333333"/>
    </linearGradient>
  </defs>

  <g transform="translate(25, 5)">
    <!-- Connection lines (drawn first, so chips overlap them) -->
    <line x1="48" y1="28" x2="65" y2="50" stroke="#1A1A1A" stroke-width="1.3" opacity="0.55"/>
    <line x1="102" y1="28" x2="85" y2="50" stroke="#1A1A1A" stroke-width="1.3" opacity="0.55"/>
    <line x1="48" y1="82" x2="65" y2="60" stroke="#1A1A1A" stroke-width="1.3" opacity="0.55"/>
    <line x1="102" y1="82" x2="85" y2="60" stroke="#1A1A1A" stroke-width="1.3" opacity="0.55"/>

    <!-- ERP (top-left) -->
    <rect x="6" y="10" width="46" height="24" rx="4" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="29" y="27" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="700" fill="#1A1A1A" text-anchor="middle" letter-spacing="0.5">ERP</text>

    <!-- EDI (top-right) -->
    <rect x="98" y="10" width="46" height="24" rx="4" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="121" y="27" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="700" fill="#1A1A1A" text-anchor="middle" letter-spacing="0.5">EDI</text>

    <!-- 1C (bottom-left) -->
    <rect x="6" y="76" width="46" height="24" rx="4" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="29" y="93" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="700" fill="#1A1A1A" text-anchor="middle" letter-spacing="0.5">1C</text>

    <!-- EAM (bottom-right) -->
    <rect x="98" y="76" width="46" height="24" rx="4" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="121" y="93" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="700" fill="#1A1A1A" text-anchor="middle" letter-spacing="0.5">EAM</text>

    <!-- Central API hub -->
    <rect x="55" y="44" width="40" height="22" rx="4" fill="url(#g4-api)" stroke="#1A1A1A" stroke-width="1.6"/>
    <text x="75" y="59" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.6">API</text>
  </g>
</svg>
