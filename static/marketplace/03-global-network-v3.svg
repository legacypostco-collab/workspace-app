<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(50, 8)">
    <!-- Globe outline -->
    <circle cx="50" cy="52" r="50" fill="none" stroke="#1A1422" stroke-width="1.8"/>

    <!-- Inner globe fill (subtle) -->
    <circle cx="50" cy="52" r="50" fill="#1A1422" opacity="0.025"/>

    <!-- Meridians (curved ellipses for globe feel) -->
    <ellipse cx="50" cy="52" rx="22" ry="50" fill="none" stroke="#1A1422" stroke-width="1.1" opacity="0.5"/>
    <ellipse cx="50" cy="52" rx="50" ry="20" fill="none" stroke="#1A1422" stroke-width="1.1" opacity="0.5"/>

    <!-- Equator (more visible) -->
    <line x1="0" y1="52" x2="100" y2="52" stroke="#1A1422" stroke-width="1.3" opacity="0.6"/>
    <!-- Prime meridian -->
    <line x1="50" y1="2" x2="50" y2="102" stroke="#1A1422" stroke-width="1.3" opacity="0.6"/>

    <!-- Connection arcs (drawn before hubs so hubs cover ends) -->
    <path d="M 28 30 Q 50 14 76 38" fill="none" stroke="#1A1422" stroke-width="1.4" stroke-dasharray="3 2.5"/>
    <path d="M 28 30 Q 36 50 54 64" fill="none" stroke="#1A1422" stroke-width="1.4" stroke-dasharray="3 2.5"/>
    <path d="M 76 38 Q 70 56 54 64" fill="none" stroke="#1A1422" stroke-width="1.4" stroke-dasharray="3 2.5"/>

    <!-- Hub: EU -->
    <circle cx="28" cy="30" r="13" fill="none" stroke="#1A1422" stroke-width="1" opacity="0.2"/>
    <circle cx="28" cy="30" r="7" fill="#1A1422"/>
    <circle cx="28" cy="30" r="2.5" fill="#fff"/>

    <!-- Hub: China -->
    <circle cx="76" cy="38" r="13" fill="none" stroke="#1A1422" stroke-width="1" opacity="0.2"/>
    <circle cx="76" cy="38" r="7" fill="#1A1422"/>
    <circle cx="76" cy="38" r="2.5" fill="#fff"/>

    <!-- Hub: UAE -->
    <circle cx="54" cy="64" r="13" fill="none" stroke="#1A1422" stroke-width="1" opacity="0.2"/>
    <circle cx="54" cy="64" r="7" fill="#1A1422"/>
    <circle cx="54" cy="64" r="2.5" fill="#fff"/>
  </g>
</svg>
