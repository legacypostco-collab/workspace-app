<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Connection lines from center to peripherals (drawn first) -->
  <line x1="100" y1="60" x2="40" y2="22" stroke="#151515" stroke-width="1.5" opacity="0.35" stroke-dasharray="3 3"/>
  <line x1="100" y1="60" x2="160" y2="22" stroke="#151515" stroke-width="1.5" opacity="0.35" stroke-dasharray="3 3"/>
  <line x1="100" y1="60" x2="40" y2="98" stroke="#151515" stroke-width="1.5" opacity="0.35" stroke-dasharray="3 3"/>
  <line x1="100" y1="60" x2="160" y2="98" stroke="#151515" stroke-width="1.5" opacity="0.35" stroke-dasharray="3 3"/>

  <!-- Peripheral systems -->
  <!-- ERP top-left -->
  <rect x="14" y="12" width="52" height="22" rx="6" fill="#fff" stroke="#151515" stroke-width="1.8"/>
  <text x="40" y="27" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="800" fill="#151515" text-anchor="middle" letter-spacing="0.5">ERP</text>

  <!-- EDI top-right -->
  <rect x="134" y="12" width="52" height="22" rx="6" fill="#fff" stroke="#151515" stroke-width="1.8"/>
  <text x="160" y="27" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="800" fill="#151515" text-anchor="middle" letter-spacing="0.5">EDI</text>

  <!-- 1С bottom-left -->
  <rect x="14" y="86" width="52" height="22" rx="6" fill="#fff" stroke="#151515" stroke-width="1.8"/>
  <text x="40" y="101" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="800" fill="#151515" text-anchor="middle" letter-spacing="0.5">1С</text>

  <!-- EAM bottom-right -->
  <rect x="134" y="86" width="52" height="22" rx="6" fill="#fff" stroke="#151515" stroke-width="1.8"/>
  <text x="160" y="101" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="800" fill="#151515" text-anchor="middle" letter-spacing="0.5">EAM</text>

  <!-- Central hub (orange filled circle) -->
  <circle cx="100" cy="60" r="22" fill="none" stroke="#E84A21" stroke-width="1.5" opacity="0.25"/>
  <circle cx="100" cy="60" r="18" fill="#E84A21"/>
  <text x="100" y="65" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0.5">API</text>

  <!-- Tiny dots on connection lines for "data flow" feel -->
  <circle cx="70" cy="41" r="2" fill="#E84A21"/>
  <circle cx="130" cy="41" r="2" fill="#E84A21"/>
  <circle cx="70" cy="79" r="2" fill="#E84A21"/>
  <circle cx="130" cy="79" r="2" fill="#E84A21"/>
</svg>
