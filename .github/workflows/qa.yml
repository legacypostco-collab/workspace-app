name: QA — Playwright + Lighthouse

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright smoke + regress
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput
        env:
          DJANGO_SETTINGS_MODULE: consolidator_site.settings
          DATABASE_URL: sqlite:///${{ github.workspace }}/db.sqlite3

      - name: Start dev server
        run: |
          nohup python manage.py runserver 127.0.0.1:8001 --noreload > /tmp/django.log 2>&1 &
          # ждём пока поднимется
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8001/ > /dev/null; then
              echo "Django up"; break
            fi
            sleep 1
          done
        env:
          DJANGO_SETTINGS_MODULE: consolidator_site.settings

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright + browsers
        working-directory: e2e
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Smoke (must-pass on every PR)
        working-directory: e2e
        env:
          BASE_URL: http://127.0.0.1:8001
        run: npx playwright test --grep @smoke --project=chromium-desktop

      - name: Full chromium-desktop regress (allowed to flake on baseline)
        working-directory: e2e
        env:
          BASE_URL: http://127.0.0.1:8001
        run: npx playwright test --project=chromium-desktop
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

      - name: Upload Django log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: django-log
          path: /tmp/django.log
          retention-days: 7

  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: e2e
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: e2e/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
        env: { DJANGO_SETTINGS_MODULE: consolidator_site.settings }
      - run: |
          nohup python manage.py runserver 127.0.0.1:8001 --noreload > /tmp/django.log 2>&1 &
          for i in {1..30}; do curl -sf http://127.0.0.1:8001/ > /dev/null && break; sleep 1; done
        env: { DJANGO_SETTINGS_MODULE: consolidator_site.settings }
      - working-directory: e2e
        run: npm ci || npm install
      - working-directory: e2e
        run: npm run lighthouse
        continue-on-error: true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: e2e/.lighthouseci
          retention-days: 14
