name: Deploy to production

# Авто-деплой на прод (consolidatorparts.com, Timeweb VPS) при пуше в main.
# Раннер GitHub находится ВНЕ РФ → до московского IP достукивается стабильно
# (ТСПУ режет путь РФ-юзер→сервер, а не inbound из-за рубежа). Это снимает
# ручной деплой через консоль Timeweb и зависимость от нестабильного SSH с Mac.
#
# Требуется один секрет репозитория:
#   DEPLOY_SSH_KEY — приватный ed25519-ключ (его публичная часть в authorized_keys сервера).

on:
  push:
    branches: [main]
  workflow_dispatch: {}        # + ручной запуск кнопкой во вкладке Actions

concurrency:
  group: deploy-prod
  cancel-in-progress: false    # не отменяем идущий деплой при новом пуше — дожидаемся

env:
  DEPLOY_HOST: 72.56.234.89
  DEPLOY_USER: root
  APP_DIR: /var/www/workspace-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -t ed25519,rsa "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy (git pull + collectstatic + migrate + check + restart)
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /var/www/workspace-app
          git pull origin main
          source venv/bin/activate
          python manage.py collectstatic --noinput
          python manage.py migrate --noinput
          python manage.py check
          systemctl restart gunicorn daphne
          sleep 2
          systemctl is-active gunicorn daphne
          # Smoke: ориджин отдаёт 200 на /chat/ (curl с самого сервера — надёжно)
          curl -fsS -o /dev/null -w 'smoke /chat/ -> HTTP %{http_code}\n' \
            -k -H 'Host: consolidatorparts.com' https://127.0.0.1/chat/
          echo "DEPLOY OK: $(git rev-parse --short HEAD)"
          REMOTE
